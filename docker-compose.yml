services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-voyagetrack}
      POSTGRES_USER: ${POSTGRES_USER:-voyage}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-voyage_dev_password}
    ports: ["5432:5432"]
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./server/sql/schema.sql:/docker-entrypoint-initdb.d/01-schema.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-voyage} -d ${POSTGRES_DB:-voyagetrack}"]
      interval: 5s
      timeout: 3s
      retries: 10
  api:
    build: ./server
    environment:
      DATABASE_URL: postgres://voyage:voyage_dev_password@db:5432/voyagetrack
      PORT: 4000
      AIS_API_URL: ${AIS_API_URL:-}
      AIS_API_KEY: ${AIS_API_KEY:-}
      WEATHER_API_URL: ${WEATHER_API_URL:-}
      WEATHER_API_KEY: ${WEATHER_API_KEY:-}
    ports: ["4000:4000"]
    depends_on:
      db:
        condition: service_healthy
  web:
    build: ./web
    environment:
      VITE_API_URL: http://localhost:4000/api
    ports: ["5173:5173"]
    depends_on: [api]
volumes:
  pgdata:
